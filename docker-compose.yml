services:
  # 1. Database Service
  postgres:
    image: postgres:16.14-trixie
    container_name: pfa_service_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Flyway Migrations Runner
  flyway:
    image: flyway/flyway:10.11.0-alpine
    container_name: pfa_service_migrations
    command: -url=jdbc:postgresql://postgres:5432/mydatabase -user=admin -password=password migrate
    volumes:
      - ../../java/pfa-service-manager/src/main/resources/db/migration:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring-network

  # 3. Rebuilt Node.js Backend Application
  node-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mydatabase
      - DB_USERNAME=admin
      - DB_PASSWORD=password
      - JWT_SECRET=supersecretkeyformigratedpfaapp
      - S3_BUCKET_NAME=pfa-player-photo
      - AWS_REGION=eu-north-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    networks:
      - monitoring-network

volumes:
  postgres-data:

networks:
  monitoring-network:
    driver: bridge
